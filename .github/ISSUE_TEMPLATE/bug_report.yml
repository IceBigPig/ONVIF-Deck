name: Bug report
description: Report a reproducible ONVIF Deck problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove passwords, credential-bearing RTSP URLs, serial numbers, public
        IP addresses, faces, and private scenes before submitting this report.
  - type: input
    id: version
    attributes:
      label: ONVIF Deck version
      placeholder: "1.1.1"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: camera
    attributes:
      label: Camera information
      description: Vendor, model, firmware, and sanitized ONVIF behavior.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials and private identifying information.
          required: true
